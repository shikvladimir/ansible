---
- name: Initial Ubuntu server setup
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install basic utilities
      ansible.builtin.apt:
        name:
          - nano
          - fish
          - tree
          - htop
          - curl
          - wget
          - git
          - unzip
          - zip
          - ca-certificates
          - gnupg
          - software-properties-common
          - python3-pip
          - python3-requests
        state: present

    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC
      tags:
        - timezone