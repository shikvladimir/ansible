
---
- name: Install Jenkins
  hosts: all
  become: true

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Jenkins repository key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add Jenkins LTS repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Create Jenkins home directory
      ansible.builtin.file:
        path: /home/jenkins
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0750"

    - name: Configure Jenkins home
      ansible.builtin.lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_HOME='
        line: 'JENKINS_HOME=/home/jenkins'
        create: true
      notify: Restart Jenkins

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

  handlers:
    - name: Restart Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
