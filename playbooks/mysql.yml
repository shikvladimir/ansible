---
- name: Установка и настройка MySQL
  hosts: db_servers
  become: yes
  vars_files:
    - "/ansible/.env"
  vars:
    mysql_root_password: "secure_password_here" # Замените на свой пароль

  tasks:
    - name: Обновление кэша apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установка MySQL сервера и python3-pymysql
      apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present

    - name: Убедиться, что MySQL запущен и работает
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Установка пароля root для MySQL
      mysql_user:
        login_user: root
        login_password: ""
        name: root
        password: "{{ mysql_root_password }}"
        host: localhost
        check_implicit_admin: yes

    - name: Удаление анонимных пользователей
      mysql_user:
        name: ""
        host_all: yes
        state: absent
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Удаление тестовой базы данных
      mysql_db:
        name: test
        state: absent
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Перезапуск службы MySQL для применения настроек
      service:
        name: mysql
        state: restarted
